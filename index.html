<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Traductor en vivo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0b0b0c;
    --card: #17181b;
    --card2: #202126;
    --accent: #3ddc84;
    --red: #e74c3c;
    --text: #f6f6f7;
    --muted: #8b8d93;
    --fs: 28px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }

  /* ---------- barra superior ---------- */
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0 6px;
  }
  select {
    background: var(--card2);
    color: var(--text);
    border: none;
    border-radius: 10px;
    padding: 9px 8px;
    font-size: 14px;
    flex: 1;
    min-width: 0;
    appearance: none;
    text-align: center;
  }
  .arrow { color: var(--muted); font-size: 13px; }
  .iconbtn {
    background: var(--card2);
    color: var(--text);
    border: none;
    border-radius: 10px;
    width: 38px;
    height: 38px;
    font-size: 15px;
    font-weight: 600;
    flex: 0 0 auto;
  }
  .iconbtn.active { background: var(--accent); color: #063; }

  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 20px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
  }
  .status.on .dot { background: var(--accent); animation: pulse 1.3s infinite; }
  .status.on { color: var(--accent); }
  .status.err { color: #f0a; }
  .status.err .dot { background: #f0a; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  /* ---------- paneles ---------- */
  .panel { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .box {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .box.original {
    flex: 0 0 auto;
    max-height: 19vh;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.35;
  }
  .box.translated {
    flex: 1;
    min-height: 0;
    font-size: var(--fs);
    line-height: 1.32;
    font-weight: 600;
    letter-spacing: -0.2px;
  }
  body.hide-original .box.original { display: none; }
  .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #5f6168;
    margin-bottom: 5px;
    display: block;
    position: sticky;
    top: -12px;
    background: var(--card);
    padding: 4px 0;
  }
  .line { margin: 0 0 10px; }
  .line.pending { opacity: .5; }
  .line.live { opacity: .62; font-style: italic; font-weight: 500; }
  .placeholder { color: var(--muted); font-size: 15px; font-weight: 400; font-style: italic; }
  .rtl { direction: rtl; text-align: right; }

  /* ---------- controles ---------- */
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0 8px;
  }
  #toggle {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 18px 0;
    font-size: 18px;
    font-weight: 700;
    background: var(--accent);
    color: #063;
  }
  #toggle.on { background: var(--red); color: #fff; }
  .hint { text-align: center; font-size: 11.5px; color: #5f6168; padding-bottom: 6px; }
</style>
</head>
<body>

<div class="bar">
  <select id="src" aria-label="Idioma del guía"></select>
  <span class="arrow">→</span>
  <select id="dst" aria-label="Tu idioma"></select>
</div>

<div class="status" id="status"><span class="dot"></span><span id="statusText">Pulsa Escuchar</span></div>

<div class="panel">
  <div class="box original" id="originalBox">
    <span class="label" id="origLabel">Original</span>
    <div id="original"></div>
  </div>
  <div class="box translated" id="transBox">
    <span class="label">Traducción</span>
    <div id="translated"><div class="placeholder">La traducción aparecerá aquí, frase a frase, mientras el guía habla.</div></div>
  </div>
</div>

<div class="controls">
  <button class="iconbtn" id="fsDown" title="Texto más pequeño">A-</button>
  <button id="toggle">Escuchar</button>
  <button class="iconbtn" id="fsUp" title="Texto más grande">A+</button>
</div>
<div class="bar" style="padding-top:0">
  <button class="iconbtn" id="eyeBtn" style="flex:1" title="Mostrar/ocultar original">Original</button>
  <button class="iconbtn" id="voiceBtn" style="flex:1" title="Leer en voz alta">🔊 Voz</button>
  <button class="iconbtn" id="copyBtn" style="flex:1" title="Copiar todo">Copiar</button>
  <button class="iconbtn" id="clearBtn" style="flex:1" title="Borrar">Borrar</button>
</div>
<button class="iconbtn" id="videoModeBtn" style="width:100%;height:38px" title="Optimizar la escucha de audio por altavoz">🎬 Audio de vídeo externo</button>
<div class="hint" id="hint">Inglés → español · necesita internet y permiso de micrófono · v10</div>

<script>
'use strict';

/* ============ idiomas ============ */
const LANGS = [
  { code: 'ar-MA', tl: 'ar', name: 'Árabe (Marruecos)', rtl: true },
  { code: 'fr-FR', tl: 'fr', name: 'Francés' },
  { code: 'ar-SA', tl: 'ar', name: 'Árabe estándar', rtl: true },
  { code: 'en-US', tl: 'en', name: 'Inglés' },
  { code: 'es-ES', tl: 'es', name: 'Español' },
  { code: 'it-IT', tl: 'it', name: 'Italiano' },
  { code: 'de-DE', tl: 'de', name: 'Alemán' },
  { code: 'pt-PT', tl: 'pt', name: 'Portugués' }
];

const $ = id => document.getElementById(id);
const srcSel = $('src'), dstSel = $('dst');
const statusEl = $('status'), statusText = $('statusText');
const originalEl = $('original'), translatedEl = $('translated');
const toggleBtn = $('toggle'), origLabel = $('origLabel');

LANGS.forEach(l => {
  srcSel.add(new Option(l.name, l.code));
  dstSel.add(new Option(l.name, l.code));
});

const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};

// Inglés es el idioma principal para este uso. Migra una sola vez el valor
// inicial antiguo (árabe de Marruecos); después se respeta lo que elija la usuaria.
const savedSource = store.get('src', '');
if (store.get('src-default-v2', '0') !== '1') {
  if (!savedSource || savedSource === 'ar-MA') store.set('src', 'en-US');
  store.set('src-default-v2', '1');
}
srcSel.value = store.get('src', 'en-US');
dstSel.value = store.get('dst', 'es-ES');
let fontSize = parseInt(store.get('fs', '28'), 10);
let showOriginal = store.get('orig', '1') === '1';
let voiceOn = store.get('voice', '0') === '1';
let videoMode = store.get('video-mode', '0') === '1';
let videoAudioStream = null, videoAudioTrack = null;

const srcLang = () => LANGS.find(l => l.code === srcSel.value) || LANGS[0];
const dstLang = () => LANGS.find(l => l.code === dstSel.value) || LANGS[4];

function applyPrefs() {
  document.documentElement.style.setProperty('--fs', fontSize + 'px');
  document.body.classList.toggle('hide-original', !showOriginal);
  $('eyeBtn').classList.toggle('active', showOriginal);
  $('voiceBtn').classList.toggle('active', voiceOn);
  $('videoModeBtn').classList.toggle('active', videoMode);
  $('videoModeBtn').textContent = videoMode ? '🎬 Audio de vídeo externo · activado' : '🎬 Audio de vídeo externo';
  $('videoModeBtn').disabled = listening;
  if (videoMode && !listening) $('hint').textContent = 'Reproduce el vídeo por altavoz cerca del móvil; evita los auriculares.';
  origLabel.textContent = 'Original · ' + srcLang().name;
  originalEl.classList.toggle('rtl', !!srcLang().rtl);
  translatedEl.classList.toggle('rtl', !!dstLang().rtl);
}

/* ============ traducción (3 proveedores con fallback) ============ */
const cache = new Map();
const FAILED = ['…', '(sin conexión)'];
let provider = 0;

async function fetchT(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

const PROVIDERS = [
  async (q, sl, tl) => {
    const d = await fetchT('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=' +
      sl + '&tl=' + tl + '&q=' + encodeURIComponent(q), 4000);
    return d[0].map(s => s[0]).join('');
  },
  async (q, sl, tl) => {
    const d = await fetchT('https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=' +
      sl + '&tl=' + tl + '&q=' + encodeURIComponent(q), 4000);
    if (Array.isArray(d)) return (Array.isArray(d[0]) ? d[0][0] : d[0]) || '';
    return d.sentences ? d.sentences.map(s => s.trans).join('') : '';
  },
  async (q, sl, tl) => {
    const d = await fetchT('https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(q) + '&langpair=' + sl + '|' + tl, 5000);
    return d.responseData.translatedText;
  }
];

/* trozos cortos: la petición va por URL (GET) y tiene límite de longitud */
function chunk(text, max) {
  if (text.length <= max) return [text];
  const out = [];
  let rest = text;
  while (rest.length > max) {
    let cut = rest.lastIndexOf(' ', max);
    if (cut < max * 0.5) cut = max;
    out.push(rest.slice(0, cut));
    rest = rest.slice(cut).trimStart();
  }
  if (rest) out.push(rest);
  return out;
}

async function translate(text) {
  const q = text.trim();
  if (!q) return '';
  const sl = srcLang().tl, tl = dstLang().tl;
  if (sl === tl) return q;
  const key = sl + '|' + tl + '|' + q;
  if (cache.has(key)) return cache.get(key);

  const parts = chunk(q, 900);
  for (let attempt = 0; attempt < PROVIDERS.length; attempt++) {
    const i = (provider + attempt) % PROVIDERS.length;
    try {
      const res = [];
      for (const p of parts) res.push(await PROVIDERS[i](p, sl, tl));
      const out = res.join(' ').trim();
      if (!out) throw new Error('vacío');
      provider = i;                                  // el que funciona se queda primero
      if (cache.size > 600) cache.clear();
      cache.set(key, out);
      return out;
    } catch (e) { /* siguiente proveedor */ }
  }
  return navigator.onLine ? '…' : '(sin conexión)';
}

/* ============ voz de salida (opcional, con auriculares) ============ */
function speak(text) {
  if (!voiceOn || !window.speechSynthesis || !text) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = dstLang().code;
    u.rate = 1.08;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ============ render ============ */
let lines = [];          // { orig, trad, done }
let liveOrig = '', liveTrad = '';
const MAX_LINES = 400;

function nearBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 80; }

function render() {
  const stickT = nearBottom($('transBox')), stickO = nearBottom($('originalBox'));

  if (!lines.length && !liveOrig) {
    translatedEl.innerHTML = '<div class="placeholder">La traducción aparecerá aquí, frase a frase, mientras el guía habla.</div>';
    originalEl.textContent = '';
  } else {
    const frag = document.createDocumentFragment();
    for (const l of lines) {
      const d = document.createElement('div');
      d.className = 'line' + (l.done ? '' : ' pending');
      d.textContent = l.trad || '…';
      frag.appendChild(d);
    }
    if (liveTrad || liveOrig) {
      const d = document.createElement('div');
      d.className = 'line live';
      d.textContent = liveTrad || '…';
      frag.appendChild(d);
    }
    translatedEl.replaceChildren(frag);

    const of = document.createDocumentFragment();
    for (const l of lines) {
      const d = document.createElement('div');
      d.className = 'line';
      d.textContent = l.orig;
      of.appendChild(d);
    }
    if (liveOrig) {
      const d = document.createElement('div');
      d.className = 'line live';
      d.textContent = liveOrig;
      of.appendChild(d);
    }
    originalEl.replaceChildren(of);
  }

  if (stickT) $('transBox').scrollTop = $('transBox').scrollHeight;
  if (stickO) $('originalBox').scrollTop = $('originalBox').scrollHeight;
}

/* Cola en serie: conserva el orden de las frases aunque una traduccion tarde.
   Guarda la LINEA, no su indice: las lineas se recortan al llegar al tope. */
const queue = [];
const inFlight = new Set();
let draining = false;

/* Deja solo letras y numeros: asi "Suivez-moi." y "suivez moi" son la misma frase. */
const normalize = t => t.toLowerCase().normalize('NFD')
  .replace(/[^\p{L}\p{N}\s]/gu, ' ')
  .replace(/\s+/g, ' ')
  .trim();

/* Chrome en Android va cerrando como DEFINITIVA cada version parcial de la frase:
     "bonjour" / "bonjour aujourd'hui" / "bonjour aujourd'hui il fait beau"
   Cada una llega con indice nuevo y texto distinto, asi que no vale con filtrar
   repetidos. Si la frase nueva empieza por la anterior, es la misma creciendo:
   se sustituye esa linea en vez de anadir otra. */
const CRECIMIENTO_MS = 15000;
const REPETICION_MS = 60000;

/* Cuando el reconocimiento se reinicia puede volver a enviar varios fragmentos
   ya mostrados, empezando por uno anterior al último. Busca esa repetición en
   las líneas recientes y también en grupos contiguos de fragmentos. */
function quitarRepeticionReciente(texto, norm, now) {
  const desde = Math.max(0, lines.length - 10);
  let mejor = 0;
  let esPrefijoCorto = false;

  for (let i = desde; i < lines.length; i++) {
    let unido = '';
    for (let j = i; j < lines.length && j < i + 6; j++) {
      if (now - lines[j].at > REPETICION_MS) break;
      unido = unido ? unido + ' ' + lines[j].norm : lines[j].norm;
      const palabras = unido.split(' ').filter(Boolean).length;
      if (palabras < 6 || palabras <= mejor) continue;

      if (norm === unido || unido.startsWith(norm + ' ')) {
        mejor = norm.split(' ').filter(Boolean).length;
        esPrefijoCorto = true;
      } else if (norm.startsWith(unido + ' ')) {
        mejor = palabras;
        esPrefijoCorto = false;
      }
    }
  }

  if (!mejor) return texto;
  if (esPrefijoCorto) return '';
  return quitarPalabras(texto, mejor);
}

/* Cuantas palabras del final de A coinciden con el principio de B.
   Al reiniciarse, Android repite el final de lo anterior:
     A = "bonjour aujourd hui"   B = "aujourd hui il fait beau"  -> 2 */
function solape(a, b) {
  const x = a.split(' '), y = b.split(' ');
  const max = Math.min(x.length, y.length, 15);
  for (let k = max; k >= 2; k--) {
    if (x.slice(-k).join(' ') === y.slice(0, k).join(' ')) return k;
  }
  return 0;
}

/* Devuelve el texto original quitandole sus k primeras palabras.
   Cuenta sobre el texto normalizado, porque "aujourd'hui" son 2 palabras ahi. */
function quitarPalabras(raw, k) {
  if (k <= 0) return raw;
  const trozos = raw.split(/(\s+)/);
  let contadas = 0, i = 0;
  for (; i < trozos.length; i++) {
    if (!trozos[i].trim()) continue;
    contadas += normalize(trozos[i]).split(' ').filter(Boolean).length;
    if (contadas >= k) { i++; break; }
  }
  return trozos.slice(i).join('').trim();
}

function extender(prev, textoCompleto, normCompleta) {
  prev.orig = textoCompleto;
  prev.norm = normCompleta;
  prev.at = Date.now();
  prev.rev++;
  prev.done = false;
  if (!queue.includes(prev)) queue.push(prev);
  render();
  drain();
}

function pushFinal(text) {
  let t = text.trim();
  if (!t) return;
  let norm = normalize(t);
  if (!norm) return;
  const now = Date.now();
  t = quitarRepeticionReciente(t, norm, now);
  if (!t) return;
  norm = normalize(t);
  const prev = lines[lines.length - 1];

  if (prev && now - prev.at < CRECIMIENTO_MS) {
    if (norm === prev.norm) { prev.at = now; return; }          // calcada
    if (prev.norm.startsWith(norm + ' ')) { prev.at = now; return; } // trozo mas corto
    if (norm.startsWith(prev.norm + ' ')) {                     // la misma, mas larga
      extender(prev, t, norm);
      return;
    }
    const k = solape(prev.norm, norm);                          // trozos solapados
    if (k) {
      const cola = quitarPalabras(t, k);
      if (!cola) { prev.at = now; return; }
      extender(prev, prev.orig + ' ' + cola, prev.norm + ' ' + normalize(cola));
      return;
    }
  }

  const line = { orig: t, norm, at: now, trad: '', done: false, rev: 0 };
  lines.push(line);
  if (lines.length > MAX_LINES) lines = lines.slice(-MAX_LINES);
  queue.push(line);
  render();
  drain();
}

async function drain() {
  if (draining) return;
  draining = true;
  while (queue.length) {
    const line = queue.shift();
    if (!line) continue;
    inFlight.add(line);
    const rev = line.rev;
    try {
      const t = await translate(line.orig);
      if (line.rev !== rev) continue;    // la frase crecio mientras se traducia
      line.trad = t;
      line.done = !FAILED.includes(t);
      render();
      if (line.done) speak(line.trad);
    } finally {
      inFlight.delete(line);
    }
  }
  draining = false;
}

/* reintenta las frases que se quedaron sin traducir por falta de cobertura */
function retryPending() {
  let n = 0;
  for (const l of lines) {
    if (!l.done && !queue.includes(l) && !inFlight.has(l)) { queue.push(l); n++; }
  }
  if (n) { drain(); return n; }
  return 0;
}

/* traducción del tramo que se está diciendo ahora mismo */
let liveTimer = null, liveSeq = 0;
function setLive(text) {
  const seq = ++liveSeq;
  liveOrig = text;
  clearTimeout(liveTimer);
  if (!text.trim()) { liveTrad = ''; render(); return; }
  render();
  liveTimer = setTimeout(async () => {
    const t = await translate(text);
    if (seq === liveSeq) { liveTrad = t; render(); }
  }, 350);
}

/* ============ reconocimiento ============ */
/* Cuantos resultados definitivos lleva ya procesados ESTA sesion de escucha.
   Android reenvia la lista entera en cada evento: sin este contador,
   cada frase se anadiria una y otra vez. */
let processedCount = 0;

function processResults(results) {
  let interim = '';
  for (let i = 0; i < results.length; i++) {
    const res = results[i];
    const txt = res[0] ? res[0].transcript : '';
    if (res.isFinal) {
      if (i >= processedCount) {
        processedCount = i + 1;
        pushFinal(txt);
      }
    } else if (i >= processedCount) {
      interim += txt;
    }
  }
  setLive(interim);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, listening = false;
let lastActivity = 0, restarts = 0, restartWindow = 0, restartTimer = null;

function setStatus(text, kind) {
  statusText.textContent = text;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}

function build() {
  const r = new SR();
  r.lang = srcSel.value;
  r.continuous = true;        // clave: no se corta en cada frase
  r.interimResults = true;    // clave: texto mientras habla
  r.maxAlternatives = 1;

  r.onstart = () => {
    lastActivity = Date.now();
    processedCount = 0;          // la lista de resultados se reinicia con el motor
    setStatus('Escuchando · ' + srcLang().name, 'on');
  };
  r.onaudiostart = () => { lastActivity = Date.now(); };
  r.onspeechstart = () => { lastActivity = Date.now(); setStatus('Te oigo…', 'on'); };

  r.onresult = (ev) => {
    lastActivity = Date.now();
    processResults(ev.results);
    if (listening) setStatus('Escuchando · ' + srcLang().name, 'on');
  };

  r.onerror = (ev) => {
    if (ev.error === 'no-speech' || ev.error === 'aborted') return;
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      stop('Micrófono denegado. Permítelo en los ajustes del navegador.', 'err');
      return;
    }
    if (ev.error === 'network') {
      setStatus('Problema de conexión · reanudando escucha…', 'err');
      restart(1200);
      return;
    }
    if (ev.error === 'language-not-supported') {
      stop('Tu móvil no soporta ' + srcLang().name + '. Prueba otro idioma.', 'err');
      return;
    }
    setStatus('Error: ' + ev.error + ' · reintentando…', 'err');
  };

  r.onend = () => { if (listening && recognition === r) restart(); };
  return r;
}

function releaseVideoAudio() {
  if (videoAudioStream) videoAudioStream.getTracks().forEach(track => track.stop());
  videoAudioStream = null;
  videoAudioTrack = null;
}

function startRecognition() {
  if (!videoAudioTrack) { recognition.start(); return; }
  try {
    recognition.start(videoAudioTrack);
  } catch (e) {
    // Compatibilidad: algunos navegadores aún no aceptan una pista de audio.
    releaseVideoAudio();
    videoMode = false;
    store.set('video-mode', '0');
    applyPrefs();
    setStatus('Este navegador no admite el modo de vídeo; sigo con el micrófono normal.', '');
    recognition = build();
    recognition.start();
  }
}

function restart(waitMs = 0) {
  if (restartTimer !== null) return;
  const now = Date.now();
  if (now - restartWindow > 10000) { restarts = 0; restartWindow = now; }
  restarts++;
  const delay = Math.max(restarts > 6 ? 1500 : 0, waitMs);
  restartTimer = setTimeout(() => {
    restartTimer = null;
    if (!listening) return;
    try { startRecognition(); }
    catch (e) {
      try { recognition.abort(); } catch (e2) {}
      recognition = build();
      try { startRecognition(); } catch (e3) {
        restartTimer = setTimeout(() => { restartTimer = null; if (listening) restart(); }, 800);
      }
    }
  }, delay);
}

/* Vigilante: algunos navegadores no emiten onend después de abortar. */
setInterval(() => {
  if (!listening) return;
  if (Date.now() - lastActivity > 20000) {
    lastActivity = Date.now();
    setStatus('Reanudando la escucha…', 'on');
    try { recognition.abort(); } catch (e) {}
    restart(1000);                  // respaldo si abort() no dispara onend
  }
}, 5000);

setInterval(() => { if (navigator.onLine) retryPending(); }, 8000);

/* ============ pantalla encendida ============ */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && listening) {
    keepAwake(true);
    lastActivity = Date.now();
  }
});

/* ============ arranque / parada ============ */
async function start() {
  if (!SR) {
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
    setStatus(ios ? 'En iPhone usa Safari (Chrome no puede oír).' : 'Usa Chrome: este navegador no reconoce voz.', 'err');
    return;
  }
  listening = true;
  restarts = 0;
  processedCount = 0;
  lastActivity = Date.now();
  toggleBtn.textContent = 'Detener';
  toggleBtn.classList.add('on');
  srcSel.disabled = true;
  $('videoModeBtn').disabled = true;
  setStatus('Iniciando…', 'on');
  keepAwake(true);
  if (videoMode) {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('sin captura de micrófono');
      videoAudioStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        video: false
      });
      videoAudioTrack = videoAudioStream.getAudioTracks()[0];
      if (!listening) { releaseVideoAudio(); return; }
      if (!videoAudioTrack) throw new Error('sin pista de audio');
    } catch (e) {
      if (listening) stop('No se pudo acceder al micrófono para el modo de vídeo.', 'err');
      return;
    }
  }
  recognition = build();
  try { startRecognition(); } catch (e) { restart(); }
}

function stop(msg, kind) {
  listening = false;
  clearTimeout(restartTimer);
  restartTimer = null;
  clearTimeout(liveTimer);
  liveOrig = ''; liveTrad = '';
  try { recognition && recognition.stop(); } catch (e) {}
  releaseVideoAudio();
  toggleBtn.textContent = 'Escuchar';
  toggleBtn.classList.remove('on');
  srcSel.disabled = false;
  keepAwake(false);
  $('videoModeBtn').disabled = false;
  setStatus(msg || 'Detenido', kind || '');
  render();
}

toggleBtn.addEventListener('click', () => listening ? stop() : start());

/* ============ botones ============ */
$('fsUp').onclick = () => { fontSize = Math.min(56, fontSize + 3); store.set('fs', fontSize); applyPrefs(); };
$('fsDown').onclick = () => { fontSize = Math.max(16, fontSize - 3); store.set('fs', fontSize); applyPrefs(); };
$('eyeBtn').onclick = () => { showOriginal = !showOriginal; store.set('orig', showOriginal ? '1' : '0'); applyPrefs(); };
$('voiceBtn').onclick = () => {
  voiceOn = !voiceOn;
  store.set('voice', voiceOn ? '1' : '0');
  if (!voiceOn && window.speechSynthesis) speechSynthesis.cancel();
  applyPrefs();
  if (voiceOn) $('hint').textContent = 'Voz activada: usa auriculares o el micro se oirá a sí mismo';
};
$('videoModeBtn').onclick = () => {
  if (listening) return;
  videoMode = !videoMode;
  store.set('video-mode', videoMode ? '1' : '0');
  applyPrefs();
  $('hint').textContent = videoMode
    ? 'Reproduce el vídeo por altavoz cerca del móvil; evita los auriculares.'
    : 'Inglés → español · necesita internet y permiso de micrófono · v10';
};
$('copyBtn').onclick = async () => {
  const txt = lines.map(l => l.orig + '\n→ ' + l.trad).join('\n\n');
  try { await navigator.clipboard.writeText(txt); $('hint').textContent = 'Copiado (' + lines.length + ' frases)'; }
  catch (e) { $('hint').textContent = 'No se pudo copiar'; }
};
$('clearBtn').onclick = () => {
  lines = []; queue.length = 0; liveSeq++; liveOrig = ''; liveTrad = '';
  render();
};

srcSel.onchange = () => {
  store.set('src', srcSel.value);
  applyPrefs();
  if (listening) { stop(); start(); }
};
dstSel.onchange = () => { store.set('dst', dstSel.value); applyPrefs(); cache.clear(); render(); };

window.addEventListener('offline', () => { if (listening) setStatus('Sin conexión', 'err'); });
window.addEventListener('online', () => {
  const n = retryPending();
  if (listening) setStatus(n ? 'Conexión recuperada · recuperando ' + n + ' frases' : 'Escuchando · ' + srcLang().name, 'on');
  else if (n) setStatus('Conexión recuperada · recuperando ' + n + ' frases');
});

applyPrefs();
render();

/* Actualizacion automatica: si hay version nueva en el servidor, la app se
   recarga sola. Nunca en mitad de una escucha. */
if ('serviceWorker' in navigator) {
  const teniaControl = !!navigator.serviceWorker.controller;
  let yaRecargada = false;

  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.update().catch(() => {});
    setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
  }).catch(() => {});

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!teniaControl || yaRecargada) return;   // primera instalacion: no recargues
    if (listening) return;                      // no cortes al guia a media frase
    yaRecargada = true;
    location.reload();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      navigator.serviceWorker.getRegistration()
        .then(reg => reg && reg.update())
        .catch(() => {});
    }
  });
}
</script>
</body>
